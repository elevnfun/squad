[project]
name = "squad"
version = "0.2.0"
description = "$ELEVN backend: ingestion, scoring, pricing"
requires-python = ">=3.11"
dependencies = [
    "base58>=2.1.1",
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.2",
    "pynacl>=1.6.2",
    "solana>=0.36",
    "solders>=0.26",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
