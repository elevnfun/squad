<!doctype html>

<style>
@import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap");
html,body{margin:0;background:#000;width:1280px;height:720px;overflow:hidden}
#vp{position:relative;width:1280px;height:720px;overflow:hidden;background:#050506;font-family:Sora,sans-serif}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 48%,#2a2b2f 0%,#101114 55%,#030304 100%)}
#world{position:absolute;inset:0}
#stage{position:absolute;inset:0;perspective:1500px}
.word{position:absolute;left:0;width:1280px;text-align:center;color:#f4f4f1;font-weight:800;letter-spacing:-.045em;line-height:1;white-space:nowrap}
#panel{position:absolute;left:0;top:0;transform-style:preserve-3d;transform-origin:50% 50%}
#crop{position:absolute;inset:0;overflow:hidden;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.7)}
#crop img{position:absolute;left:0;top:0;transform-origin:0 0}
#co{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mk{position:absolute;border:2px solid rgba(255,255,255,.9);box-sizing:border-box}
.mk i{position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);background:#f2c14e}
.lb{position:absolute;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#f4f4f1;background:rgba(8,9,11,.82);border:1px solid rgba(255,255,255,.5);padding:.45em .8em}
.lb em{font-style:normal;color:#f2c14e}
.cd{position:absolute;font-family:"JetBrains Mono",monospace;color:rgba(255,255,255,.55);white-space:nowrap}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.78) 100%);pointer-events:none}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#end{position:absolute;inset:0;opacity:0;display:grid;place-items:center;text-align:center}
#end .logo{font-weight:800;font-size:210px;letter-spacing:-.05em;color:#f4f4f1;line-height:1}
#end .logo i{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:#f2c14e;margin-left:.04em}
#end .url{font-weight:600;font-size:46px;letter-spacing:.22em;color:#f4f4f1;margin-top:18px}
#end .tag{font-weight:600;font-size:28px;letter-spacing:.18em;text-transform:uppercase;color:#f2c14e;margin-top:22px}
</style></head><body>

</div>

<script>
const R=await_rects=null;
let RECTS=null, IMGS={}, SZ={};
const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}, eo=t=>{t=Math.max(0,Math.min(1,t));return 1-Math.pow(1-t,3)}, lerp=(a,b,t)=>a+(b-a)*t, cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

 {t0:18.50,t1:19.25,img:'ranks',crop:[0,0,1440,900],a:{cx:690,cy:430,s:.60,ry:12,rx:3,rz:0},b:{cx:650,cy:425,s:.63,ry:8,rx:2,rz:0},word:'Ranks.',wy:70,entry:'whip',dir:-1,

 {t0:19.25,t1:20.00,img:'chat',crop:[0,0,1440,900],a:{cx:610,cy:430,s:.60,ry:-10,rx:3,rz:0},b:{cx:640,cy:425,s:.63,ry:-6,rx:2,rz:0},word:'Chat.',wy:70,entry:'whip',dir:1,
  co:[{r:['chat','tab3'],label:'<em>03</em> Chat',lx:-40,ly:-120,t:.18}]},
 // blitz
 {t0:20.00,t1:23.00,img:'blitz',crop:[0,0,1440,900],a:{cx:640,cy:440,s:.58,ry:-12,rx:4,rz:0},b:{cx:610,cy:430,s:.66,ry:-6,rx:2,rz:0},word:'Blitz.',wy:55,entry:'whip',dir:-1,
  co:[{r:[null,[513,416,520,470]],label:'<em>3</em> squads, any <em>3</em> matches',lx:-380,ly:-30,t:.5},

 // draft
 {t0:26.00,t1:29.00,img:'draft',crop:[80,380,1300,520],a:{cx:640,cy:430,s:.80,ry:10,rx:3,rz:0},b:{cx:640,cy:420,s:.86,ry:5,rx:2,rz:0},word:'Draft.',wy:35,entry:'thermal',dir:1,
  co:[{r:['draft','packs'],label:'<em>5</em> personal packs',lx:-20,ly:-130,t:.5},
      {r:[null,[1040,420,320,200]],label:'Open <em>one by one</em>',lx:-100,ly:330,t:1.4}]},
 {t0:29.00,t1:32.00,img:'draft',crop:[60,880,1320,620],a:{cx:640,cy:420,s:.78,ry:-8,rx:3,rz:0},b:{cx:640,cy:410,s:.84,ry:-3,rx:1,rz:0},word:'Your five.',wy:35,entry:'whip',dir:-1,

 // boards
 {t0:32.00,t1:35.00,img:'ranks',crop:[40,280,1380,820],a:{cx:640,cy:430,s:.80,ry:9,rx:3,rz:2},b:{cx:640,cy:420,s:.86,ry:3,rx:1,rz:0},word:'Boards.',wy:30,entry:'rotate',dir:1,
  co:[{r:['ranks','tabs'],label:'Matchday <em>and</em> weekly boards',lx:-30,ly:-90,t:.4},
      {r:[null,[80,649,845,285]],label:'Top <em>5</em> paid',lx:-420,ly:70,t:1.2},
      {r:['ranks','you'],label:'Your place <em>6th</em>',lx:700,ly:-40,t:2.0}]},
 // winnings
 {t0:35.00,t1:38.00,img:'win',crop:[60,250,1320,760],a:{cx:640,cy:430,s:.84,ry:-9,rx:3,rz:0},b:{cx:640,cy:420,s:.90,ry:-3,rx:1,rz:0},word:'Collect.',wy:30,entry:'whip',dir:1,
  co:[{r:[null,[96,365,1160,130]],label:'<em>Half</em> now, half <em>locked</em>',lx:-40,ly:-130,t:.5},

];
const WORDS_END=38.0;
function shotAt(t){for(let i=SH.length-1;i>=0;i--) if(t>=SH[i].t0) return SH[i]; return SH[0]}
function place(s,P,u){ // P in page px: panel container
  const panel=document.getElementById('panel'),crop=document.getElementById('crop'),img=document.getElementById('pimg'),co=document.getElementById('co');
  const [cx0,cy0,cw,ch]=s.crop, fit=Math.min(1100/cw,520/ch), sc=fit*(0.96+0.10*ease(u)), w=cw*sc, h=ch*sc;
  panel.style.width=w+'px';panel.style.height=h+'px';
  panel.style.transform=`translate(${P.cx-w/2}px,${P.cy+52-h/2}px) rotateY(${P.ry}deg) rotateX(${P.rx}deg) rotateZ(${P.rz}deg)`;
  panel.style.webkitBoxReflect='below 10px linear-gradient(transparent 68%, rgba(255,255,255,.20))';
  const nat=SZ[s.img]; img.src=IMGS[s.img]; img.style.width=(nat.w*sc)+'px'; img.style.left=(-cx0*sc)+'px'; img.style.top=(-cy0*sc)+'px';
  return {w,h,sc,cx0,cy0};
}
let t_now=0;
function callouts(s,lt,g){
  const co=document.getElementById('co'); let html='';
  const k=1/g.sc; // 1 screen px in page units: font sizes are screen px
  const px=v=>(v*g.sc);
  s.co.forEach((c,i)=>{
    let r=c.r[1] instanceof Array?{x:c.r[1][0],y:c.r[1][1],w:c.r[1][2],h:c.r[1][3]}:RECTS[c.r[0]][c.r[1]];
    if(!r) return;
    const tt=cl((lt-c.t)/.35); if(tt<=0) return;
    const X=(r.x-g.cx0)*g.sc, Y=(r.y-g.cy0)*g.sc, Wd=r.w*g.sc, Ht=r.h*g.sc;
    // marker corners around target (scaled), min size
    const pu=c.pulse?cl((t_now-c.pulse)/.5):0; const mw=Math.max(Wd,16)*(1+.5*pu), mh=Math.max(Ht,16)*(1+.5*pu);
    html+=`<div class="mk" style="left:${X-(mw-Wd)/2}px;top:${Y-(mh-Ht)/2}px;width:${mw}px;height:${mh}px;opacity:${tt};box-shadow:0 0 ${60*pu}px rgba(242,193,78,${pu})"><i></i></div>`;
    const lx=X+Wd/2+c.lx*g.sc*0.0+c.lx*0.62, ly=Y+Ht/2+c.ly*0.62; // label offset in screen-ish px
    const x1=X+Wd/2, y1=Y+Ht/2;
    const len=Math.hypot(lx-x1,ly-y1)*tt;
    const ang=Math.atan2(ly-y1,lx-x1);
    html+=`<div style="position:absolute;left:${x1}px;top:${y1}px;width:${len}px;height:1px;background:rgba(255,255,255,.7);transform-origin:0 0;transform:rotate(${ang}rad)"></div>`;
    const full=c.label.replace(/<[^>]+>/g,'');
    const n=Math.round(full.length*cl((lt-c.t-.25)/.25));
    let shown=c.label; if(n<full.length){let cnt=0,out='',tag=false;for(const ch of c.label){if(ch==='<')tag=true;if(!tag){if(cnt>=n)continue;cnt++}out+=ch;if(ch==='>')tag=false}shown=out}
    html+=`<div class="lb" style="left:${lx}px;top:${ly}px;font-size:15px;opacity:${cl((lt-c.t-.15)/.2)};transform:translate(${c.lx<0?'-100%':'0'},-50%)">${shown}</div>`;
    // decorative coordinate tags
    html+=`<div class="cd" style="left:${X+Wd+8}px;top:${Y-14}px;font-size:10px;opacity:${tt*.8}">x: ${Math.round(r.x)}  y: ${Math.round(r.y)}</div>`;
  });
  co.innerHTML=html;
}
function setT(t){
  t_now=t; const s=shotAt(t), lt=t-s.t0, dur=s.t1-s.t0, u=cl(lt/dur);
  const P={};for(const k of ['cx','cy','s','ry','rx','rz']) P[k]=lerp(s.a[k],s.b[k],ease(u));
  const g=place(s,P,u); callouts(s,lt,g);
  // word
  const w=document.getElementById('word'); w.textContent=s.word; const wb=cl(1-lt/.45), wo=cl((dur-lt)/.3);
  w.style.top=(s.wy-30)+'px'; w.style.fontSize=(s.word.length>6?190:230)+'px';
  w.style.opacity=Math.min(1,cl(lt/.25))*Math.min(1,wo); w.style.filter=`blur(${wb*34+(1-wo)*18}px)`; w.style.transform=`scale(${1+wb*.18-(1-wo)*.06})`;
  // entry effect on world
  const world=document.getElementById('world'), e=cl(lt/.375); let tr='',fl='',ex=0;
  const ee=1-eo(e);
  if(s.entry==='whip'){tr=`translateX(${ee*520*s.dir}px)`; fl=`blur(${ee*28}px)`;}
  if(s.entry==='punch'){tr=`scale(${1+ee*.9})`; fl=`blur(${ee*26}px) brightness(${1+ee*.5})`;}
  if(s.entry==='rotate'){tr=`rotate(${ee*9*s.dir}deg) scale(${1+ee*.25}) translateX(${ee*300*s.dir}px)`; fl=`blur(${ee*26}px)`;}
  if(s.entry==='thermal'){const th=cl(1-lt/.6); fl=`grayscale(${th}) sepia(${th}) saturate(${1+th*7}) hue-rotate(${-18*th}deg) contrast(${1+th*.8}) brightness(${1+th*.6}) blur(${ee*10}px)`; tr=`scale(${1+ee*.08})`;}
  world.style.transform=tr; world.style.filter=fl;
  // landing flash on Collect (38.0)
  let f=0; if(Math.abs(t-38.0)<0.12) f=cl(1-Math.abs(t-38.0)/.12)*.4;
  if(t>=37.2&&t<38.0){ /* button glow handled by marker */ }
  document.getElementById('flash').style.opacity=f;
  // end card
  const end=document.getElementById('end'); const eu=cl((t-38.0)/.5);
  end.style.opacity=t>=38.0?eu:0; document.getElementById('stage').style.opacity=t>=38.0?cl(1-(t-38.0)/.3):1;
  document.getElementById('vp').style.opacity=1; 
  // fade to black at the very end
  end.style.filter=`blur(${(1-eu)*20}px)`; end.style.transform=`scale(${1.08-.08*eo(eu)})`;
}
async function init(){
  RECTS=window.RECTS_DATA;
  for(const k of ['today','ranks','chat','blitz','draft','win']){
    await new Promise(r=>{const im=new Image();im.onload=()=>{SZ[k]={w:im.naturalWidth,h:im.naturalHeight};IMGS[k]=im.src;r()};im.src='assets/'+k+'.png'});
  }
  // grain
  const c=document.getElementById('grain').getContext('2d'),d=c.createImageData(320,180);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}c.putImageData(d,0,0);
  window.READY=true;
}
init();
</script></body></html>
